[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "upscalex"
version = "0.1.2"
description = "UpscaleX MCP/CLI: Production-grade 8K/16K image upscaler CLI and Model Context Protocol (MCP) server powered by RealESRGAN, Vulkan GPU acceleration, and Lanczos supersampling."
readme = "README.md"
authors = [
    { name = "Arunmozhi Varman", email = "arunmozhi@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["upscalex", "realesrgan", "mcp", "upscale", "super-resolution", "ai", "image-processing", "cli", "16k", "8k", "vulkan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=0.4.0",
    "pillow>=10.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
upscalex = "upscalex.cli:main"
upscalex-mcp = "upscalex.server:main"

[project.urls]
Homepage = "https://github.com/The-Open-Source-Founder/upscalex"
Documentation = "https://github.com/The-Open-Source-Founder/upscalex#readme"
Repository = "https://github.com/The-Open-Source-Founder/upscalex.git"
Issues = "https://github.com/The-Open-Source-Founder/upscalex/issues"
Changelog = "https://github.com/The-Open-Source-Founder/upscalex/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/upscalex"]
